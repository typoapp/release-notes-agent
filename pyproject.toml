[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releasenotes-agent"
version = "0.1.0"
description = "AI agent for automated daily release notes from GitHub and JIRA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "tenacity>=8.2",
    "rich>=13.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai    = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
gemini    = ["google-genai>=1.0"]
all = [
    "releasenotes-agent[openai,anthropic,gemini]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
releasenotes = "releasenotes.cli:main"

[project.entry-points."releasenotes.ingestors"]
jira   = "releasenotes.ingestion.jira:JIRAIngestor"
github = "releasenotes.ingestion.github:GitHubIngestor"

[project.entry-points."releasenotes.llm_providers"]
openai    = "releasenotes.llm.openai:OpenAIProvider"
anthropic = "releasenotes.llm.anthropic:AnthropicProvider"
gemini    = "releasenotes.llm.gemini:GeminiProvider"

[project.entry-points."releasenotes.formatters"]
markdown = "releasenotes.output.markdown:MarkdownFormatter"
slack    = "releasenotes.output.slack:SlackFormatter"

[tool.hatch.build.targets.wheel]
packages = ["src/releasenotes"]
